[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage-module"
version = "0.3.0"
description = "Claude Code and Codex CLI usage limits on the GNOME top bar"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ai-usage = "ai_usage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ai_usage]
gnome_test_profile_model = "gjs -m tests/gnome/test-profile-model.js"
gnome_test_prefs_model = "gjs -m tests/gnome/test-prefs-model.js"
gnome_test_refresh_scheduler = "gjs -m tests/gnome/test-refresh-scheduler.js"
gnome_test_status_reader = "gjs -m tests/gnome/test-status-reader.js"
