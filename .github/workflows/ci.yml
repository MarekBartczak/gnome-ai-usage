name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y gjs python3-pytest
      - name: Python tests
        run: python3 -m pytest -q
      - name: GJS tests
        run: for t in tests/gnome/*.js; do gjs -m "$t"; done

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin apt-utils
      - name: Build .deb
        run: VERSION="${GITHUB_REF_NAME}" ./packaging/build-deb.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.deb \
            --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Check out APT repository (gh-pages)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add site origin/gh-pages
            git -C site switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
      - name: Update and sign APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          echo "${APT_SIGNING_KEY}" | gpg --batch --import
          ./packaging/build-apt-repo.sh site/apt dist/gnome-ai-usage_*_all.deb
          cp packaging/apt/gnome-ai-usage-archive-keyring.gpg site/apt/
          touch site/.nojekyll
      - name: Push gh-pages
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "APT repository: ${GITHUB_REF_NAME}"
          git push origin gh-pages
